<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EKC AI Helpdesk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI helpdesk for Eranad Knowledge City Technical Campus: admissions, KTU rules, courses and campus life.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-container">

  <header class="top-bar">
    <img src="EKC.png" alt="EKC Logo" class="logo">
    <button id="theme-toggle" class="theme-toggle" type="button"
            aria-label="Toggle dark mode" onclick="toggleTheme()">🌙</button>
  </header>

  <div id="chat-box" class="chat-area">
    <div class="bot-message">
      👋 Hello! I’m the EKC AI Helpdesk.<br>
      Ask me anything about admissions, KTU rules, courses, or campus life.
    </div>
  </div>

  <div class="chips">
    <button type="button" onclick="quickAsk('admission process')">Admissions</button>
    <button type="button" onclick="quickAsk('courses offered')">Courses</button>
    <button type="button" onclick="quickAsk('fee structure')">Fees</button>
    <button type="button" onclick="quickAsk('ktu rules')">KTU Rules</button>
    <button type="button" onclick="quickAsk('placements')">Placements</button>
  </div>

  <div class="input-bar">
    <input id="user-input" placeholder="Type your question here..."
           aria-label="Type your question" maxlength="500" autocomplete="off" />
    <button id="mic-btn" type="button" aria-label="Speak your question" onclick="startSpeech()">🎙️</button>
    <button id="send-btn" type="button" aria-label="Send message" onclick="sendMessage()">➤</button>
  </div>

  <p class="notice">
    Questions are saved anonymously to improve answers. Please don’t share personal details.
    Answers are for guidance; confirm important details with the college office.
  </p>

</div>

<noscript>This chatbot needs JavaScript to run.</noscript>
<script src="script.js"></script>
</body>
</html>
